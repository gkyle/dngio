name: Build Wheels

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2022, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cibuildwheel==2.16.2

      - name: Build wheels
        env:
          CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-*
          CIBW_SKIP: "*-win32"
          CIBW_ARCHS_WINDOWS: "AMD64 ARM64"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_BEFORE_BUILD_WINDOWS: "cd build_tools && powershell -ExecutionPolicy Bypass -File build_dependencies.ps1 && pip install --only-binary=:all: pybind11 \"numpy<2.0.0\" setuptools && python setup.py build_ext --inplace && copy *.pyd ..\\src\\dngio\\ || cp *.so ../src/dngio/ || true"
          CIBW_BEFORE_BUILD_MACOS: "pip install --only-binary=:all: pybind11 \"numpy<2.0.0\" setuptools && cd build_tools && chmod +x build_dependencies_macos.sh && echo 'Starting macOS dependency build...' && bash build_dependencies_macos.sh && echo 'Checking built libraries...' && find .cache -name '*.a' | head -10 && echo 'Starting extension build...' && python setup.py build_ext --inplace && echo 'Extension built, checking output files...' && ls -la _dngio_impl* 2>/dev/null || echo 'No extension files found' && echo 'Copying to src...' && cp _dngio_impl*.so ../src/dngio/ 2>/dev/null || cp _dngio_impl*.dylib ../src/dngio/ 2>/dev/null || echo 'Copy completed (no files to copy)'"
          CIBW_BEFORE_BUILD_LINUX: "pip install --only-binary=:all: pybind11 \"numpy<2.0.0\" setuptools && cd build_tools && chmod +x build_dependencies_linux.sh && bash build_dependencies_linux.sh && python setup.py build_ext --inplace && cp _dngio_impl*.so ../src/dngio/ && ls -la ../src/dngio/"
          CIBW_BUILD_VERBOSITY: 1
        run: |
          python -m cibuildwheel --output-dir wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
      
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

