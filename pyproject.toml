[build-system]
requires = ["setuptools>=61.0", "wheel", "pybind11>=2.10.0", "numpy>=1.19.0"]
build-backend = "setuptools.build_meta:__legacy__"

[project]
name = "dngio"
version = "1.0.0"
description = "Python wrapper around Adobe DNG SDK for reading and writing DNG files"
dynamic = ["readme"]
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = ["numpy>=1.19.0"]
authors = [{name = "Kyle Scholz", email = "kyle.scholz@gmail.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Repository = "https://github.com/gkyle/dngio"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dngio = ["*.pyd", "*.so", "*.dylib", "py.typed"]

[tool.setuptools.dynamic]
readme = {file = ["README.md"], content-type = "text/markdown"}
